<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>КОНЕЧНАЯ — веб-демо</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="cv" width="320" height="240"></canvas>

  <!-- Сенсорное управление -->
  <div id="touch" class="hidden">
    <div id="stick-zone">
      <div id="stick-base"><div id="stick-knob"></div></div>
    </div>
    <div id="btn-zone">
      <button id="btn-b" class="tbtn" aria-label="Отмена">X</button>
      <button id="btn-a" class="tbtn" aria-label="Действие">Z</button>
    </div>
  </div>

  <div id="topbar">
    <button id="btn-sound" class="sysbtn" aria-label="Звук">♪</button>
    <button id="btn-full" class="sysbtn" aria-label="На весь экран">⛶</button>
  </div>

  <div id="rotate">Поверни телефон вертикально</div>
</div>

<script src="js/font.js"></script>
<script src="js/palette.js"></script>
<script src="js/textures.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/ui.js"></script>
<script src="js/world.js"></script>
<script src="js/battle.js"></script>
<script src="js/game.js"></script>
</body>
</html>
